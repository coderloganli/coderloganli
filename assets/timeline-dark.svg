<text x="104" y="247" font-size="13.5" fill="#8b949e">Software Engineer Intern · Boston, USA</text>
<text x="104" y="272" font-size="13.5" fill="#6e7681">Built an AI agent on LangChain and Bedrock that autonomously generates and debugs build</text>
