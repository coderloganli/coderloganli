<text x="104" y="332" font-size="13.5" fill="#6e7681">as the team&#x27;s standard tool.</text>
<text x="104" y="372" font-size="13.5" fill="#6e7681">Designed and built the cost-estimation step in Amazon&#x27;s internal robot-simulation platform</text>
<text x="104" y="392" font-size="13.5" fill="#6e7681">(React, Spring, DynamoDB), which every engineer passes through before running or releasing</text>
<text x="104" y="412" font-size="13.5" fill="#6e7681">a simulation; back-tested the estimator against historical runs and held its error within 20%.</text>
