<text x="104" y="64" font-size="18.5" font-weight="700" fill="#e6edf3">Northeastern CESAR Lab</text>
<text x="104" y="85" font-size="13.5" fill="#8b949e">Machine Learning Research Assistant · Boston, USA</text>
<text x="104" y="110" font-size="13.5" fill="#6e7681">Built a three-stage pipeline (RTMPose, MotionBERT, HaMeR) that labels co-speech gestures</text>
<text x="104" y="130" font-size="13.5" fill="#6e7681">in place of hand annotation, running 97 controlled experiments to choose each stage; the</text>
<text x="104" y="150" font-size="13.5" fill="#6e7681">winning 3D pose representation doubled segmentation F1.</text>
<text x="104" y="200" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#58a6ff">JAN – AUG 2025</text>
