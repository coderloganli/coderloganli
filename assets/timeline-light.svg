<text x="104" y="38" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#0969da">JAN – MAY 2026</text>
<text x="104" y="64" font-size="18.5" font-weight="700" fill="#1f2328">Northeastern CESAR Lab</text>
<text x="104" y="85" font-size="13.5" fill="#59636e">Machine Learning Research Assistant · Boston, USA</text>
<text x="104" y="110" font-size="13.5" fill="#818b98">Built a three-stage pipeline (RTMPose, MotionBERT, HaMeR) that labels co-speech gestures</text>
<text x="104" y="130" font-size="13.5" fill="#818b98">in place of hand annotation, running 97 controlled experiments to choose each stage; the</text>
<text x="104" y="150" font-size="13.5" fill="#818b98">winning 3D pose representation doubled segmentation F1.</text>
<text x="104" y="200" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#0969da">JAN – AUG 2025</text>
<text x="104" y="226" font-size="18.5" font-weight="700" fill="#1f2328">Amazon</text>
<text x="104" y="247" font-size="13.5" fill="#59636e">Software Engineer Intern · Boston, USA</text>
<text x="104" y="272" font-size="13.5" fill="#818b98">Built an AI agent on LangChain and Bedrock that autonomously generates and debugs build</text>
<text x="104" y="292" font-size="13.5" fill="#818b98">configurations from requirement docs and CDK packages, using task orchestration, context</text>
<text x="104" y="312" font-size="13.5" fill="#818b98">engineering, and a knowledge base (RAG); cut configuration time by 50% and was adopted</text>
<text x="104" y="332" font-size="13.5" fill="#818b98">as the team&#x27;s standard tool.</text>
<text x="104" y="372" font-size="13.5" fill="#818b98">Designed and built the cost-estimation step in Amazon&#x27;s internal robot-simulation platform</text>
<text x="104" y="392" font-size="13.5" fill="#818b98">(React, Spring, DynamoDB), which every engineer passes through before running or releasing</text>
<text x="104" y="412" font-size="13.5" fill="#818b98">a simulation; back-tested the estimator against historical runs and held its error within 20%.</text>
<text x="104" y="462" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#1a7f37">SEP 2023</text>
